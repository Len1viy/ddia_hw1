name: ddia-hw1

x-app: &app
  build: .
  image: ddia-hw1-app:local
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s

services:
  app_dc1:
    <<: *app
    environment:
      POD_ID: pod-1
      DATACENTER: dc-1
    ports:
      - "127.0.0.1:18081:8000"

  app_dc2:
    <<: *app
    environment:
      POD_ID: pod-2
      DATACENTER: dc-2
    ports:
      - "127.0.0.1:18082:8000"

  prometheus:
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    depends_on:
      app_dc1:
        condition: service_healthy
      app_dc2:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Copy .env.example to .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Copy .env.example to .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:13030:3000"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:3000/api/health
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
